name: Docker Build and Push CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Verify Docker Hub secrets
      - name: Verify Docker Hub secrets
        if: github.event_name == 'push'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          if [ -n "$DOCKER_USERNAME" ]; then
            echo "Docker username is configured"
          else
            echo "Docker username is missing"
          fi

          if [ -n "$DOCKER_TOKEN" ]; then
            echo "Docker token is configured"
          else
            echo "Docker token is missing"
          fi

      # Step 3: Login to Docker Hub
      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Step 4: Build API image
      - name: Build API image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/day9-api:latest ./day9-api

      # Step 5: Build Web image
      - name: Build Web image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/day9-web:latest ./day9-web

      # Step 6: Push API image
      - name: Push API image
        if: github.event_name == 'push'
        run: docker push ${{ secrets.DOCKER_USERNAME }}/day9-api:latest

      # Step 7: Push Web image
      - name: Push Web image
        if: github.event_name == 'push'
        run: docker push ${{ secrets.DOCKER_USERNAME }}/day9-web:latest