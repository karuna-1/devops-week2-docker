name: Docker Build and Push CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build API image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/day9-api:latest ./day9-api

      - name: Build Web image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/day9-web:latest ./day9-web

      - name: Push API image
        if: github.event_name == 'push'
        run: docker push ${{ secrets.DOCKER_USERNAME }}/day9-api:latest

      - name: Push Web image
        if: github.event_name == 'push'
        run: docker push ${{ secrets.DOCKER_USERNAME }}/day9-web:latest