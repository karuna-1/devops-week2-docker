services:
  api:
    build: ./day9-api
    container_name: day9-api-container
    mem_limit: 256m
    cpus: 0.5
    networks:
      - day9-network

  web:
    build: ./day9-web
    container_name: day9-web-container
    ports:
      - "5002:5002"
    env_file:
      - ./day9-web/.env
    depends_on:
      - api
    networks:
      - day9-network

networks:
  day9-network: